<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fbfaf7">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>쿨쿨 그림자극장</title>
<link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="assets/icons/favicon-192.png">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="engine/lightbox.css">
<style>
  /* 홈: 흰 벽에 불 켠 창문 하나, 그 아래 작은 창문들. 스크롤 없이 한 화면(PLAN §4 S1) */
  .home { height: 100dvh; min-height: 560px; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 6px;
    padding: env(safe-area-inset-top, 0px) 0 calc(10px + env(safe-area-inset-bottom, 0px)); max-width: 1366px; margin: 0 auto; }
  .top { display: flex; align-items: center; justify-content: space-between; padding: 4px var(--gutter) 0; }
  .mark { margin: 0; font-size: 19px; font-weight: 800; letter-spacing: .02em; }
  .mark em { font-style: normal; color: var(--lamp-ink); }
  .moonbtn { width: 48px; height: 48px; margin-right: -8px; border-radius: 50%; display: grid; place-items: center; }

  /* 창문: 맨 위가 둥근 아치. 잘려도 인물은 남도록 CSS 변수 --fx 로 인물 쪽을 비춘다 */
  .win { position: relative; overflow: hidden; background: var(--surface); }
  .crop { position: absolute; inset: 0; container-type: size; }
  .crop .lb { position: absolute; border-radius: 0; aspect-ratio: 4 / 3; width: max(100cqw, 133.34cqh);
    left: calc((100cqw - max(100cqw, 133.34cqh)) * var(--fx, .5)); top: calc(100cqh - max(100cqh, 75cqw)); }

  .hero { min-height: 0; display: grid; grid-template-rows: minmax(0, 1fr) auto; gap: 16px; padding: 22px var(--gutter) 0; }
  .hero .win { border-radius: min(40vw, 20dvh) min(40vw, 20dvh) 14px 14px; transition: box-shadow 1.2s ease;
    box-shadow: 0 18px 44px -18px color-mix(in srgb, var(--spill, #f2b366) 55%, rgba(35,38,47,.5)); }
  .hero .crop { transition: opacity .7s ease; opacity: 0; }
  .hero .crop.in { opacity: 1; }
  .bill { display: grid; gap: 4px; justify-items: center; text-align: center; }
  .bill h2 { margin: 0; font-size: 27px; font-weight: 800; line-height: 1.2; letter-spacing: -.005em; }
  .bill .blurb { display: none; margin: 0; color: var(--muted); font-size: 16px; line-height: 1.55; }
  .bill .meta { margin: 0; color: var(--muted); font-size: 14px; }
  .bill .meta button { color: var(--muted); font-size: 14px; text-decoration: underline; text-underline-offset: 3px; padding: 6px 4px; margin: -6px 0 -6px 6px; }
  .cta { display: grid; grid-template-columns: 1.15fr 1fr; gap: 10px; width: 100%; max-width: 440px; margin-top: 10px; }
  .cta .pill { min-height: 56px; padding: 0 12px; font-size: 17px; }

  /* 작은 창문 줄 */
  .shelf { padding-top: 10px; min-width: 0; }
  .shelf-head { display: flex; align-items: center; justify-content: space-between; padding: 0 var(--gutter); margin-bottom: 8px; min-height: 40px; }
  .shelf-head h3 { margin: 0; font-size: 15px; font-weight: 700; }
  .shelf-head .pill { min-height: 40px; padding: 0 14px; font-size: 14px; background: none; margin-right: -4px; }
  .row { display: flex; gap: 12px; overflow-x: auto; padding: 6px var(--gutter) 4px; scroll-snap-type: x proximity; scroll-padding: 0 var(--gutter); scrollbar-width: none; }
  .row::-webkit-scrollbar { display: none; }
  .tile { flex: none; width: 108px; display: grid; gap: 6px; text-align: center; align-content: start; scroll-snap-align: start; transition: transform .09s var(--ease); }
  .tile:not(:disabled):active { transform: scale(.96); }
  .tile .win { aspect-ratio: 4 / 5; border-radius: 46% 46% 8px 8px / 36% 36% 8px 8px; }
  .tile .crop { filter: saturate(.8) brightness(.92); transition: filter .4s ease; }
  .tile b { font-size: 13.5px; font-weight: 500; line-height: 1.3; color: var(--muted); white-space: nowrap; }
  .tile[aria-current="true"] .crop { filter: none; }
  .tile[aria-current="true"] .win { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--lamp-ink); }
  .tile[aria-current="true"] b { color: var(--ink); font-weight: 700; }
  /* 그림이 아직 없는 편: 불 꺼진 빈 창문. 대신하는 그림을 넣지 않는다 */
  .tile:disabled { cursor: default; }
  .tile:disabled .win { background: #f1efea; }
  .tile:disabled b { color: var(--faint); }

  /* 스플래시: 커튼 그림이 오기 전까지 달과 이름만 */
  .splash { position: fixed; inset: 0; z-index: 60; background: var(--bg); display: grid; place-content: center; justify-items: center; gap: 20px; transition: opacity .8s; }
  .splash.out { opacity: 0; pointer-events: none; }
  .splash .crescent { width: 56px; height: 56px; box-shadow: inset -17px -4px 0 0 var(--lamp); }
  .splash .mark { font-size: clamp(26px, 6vw, 40px); }

  /* 아이패드·가로: 창문은 왼쪽, 글과 단추는 오른쪽 */
  @media (min-aspect-ratio: 5/4), (min-width: 700px) {
    .hero { padding-top: 14px; grid-template-rows: minmax(0, 1fr); grid-template-columns: minmax(0, 1.75fr) minmax(280px, 1fr); gap: clamp(24px, 4vw, 56px); align-items: stretch; }
    .bill { justify-items: start; text-align: left; align-content: center; gap: 8px; }
    .hero .win { border-radius: min(26vw, 30dvh) min(26vw, 30dvh) 14px 14px; }
    .bill h2 { font-size: clamp(32px, 3.6vw, 44px); }
    .bill .blurb { display: block; max-width: 24em; word-break: keep-all; }
    .bill .meta { font-size: 15px; }
    .cta { grid-template-columns: 1fr; max-width: 300px; margin-top: 16px; }
    .cta .pill { min-height: 60px; font-size: 18px; }
    .shelf-head { justify-content: flex-start; gap: 16px; }
    .tile { width: 118px; }
    .tile b { font-size: 14.5px; }
  }
  @media (min-width: 700px) and (max-aspect-ratio: 5/4) { /* 아이패드 세로 */
    .hero { grid-template-columns: 1fr; grid-template-rows: minmax(0, 1fr) auto; }
    .bill { justify-items: center; text-align: center; }
    .cta { grid-template-columns: 1.15fr 1fr; max-width: 480px; }
    .row { justify-content: center; }
    .tile { width: 132px; }
  }
  /* 휴대폰 가로: 높이가 모자라 창문 옆에 글을 두고 아래로 내려 본다 */
  @media (max-height: 520px) {
    .home { height: auto; min-height: 0; grid-template-rows: auto auto auto; }
    .hero { grid-template-rows: 74dvh; }
  }
</style>
</head>
<body>
<div class="splash" id="splash" hidden><span class="crescent"></span><div class="mark"><em>쿨쿨</em> 그림자극장</div></div>
<div class="home">
  <header class="top">
    <h1 class="mark"><em>쿨쿨</em> 그림자극장</h1>
    <button class="moonbtn hold-ring" id="moon" aria-label="보호자 설정 (1초 꾹)"><span class="crescent"></span></button>
  </header>
  <section class="hero" aria-live="polite">
    <div class="win" id="heroWin"></div>
    <div class="bill">
      <h2 id="heroTitle">&nbsp;</h2>
      <p class="blurb" id="heroLine"></p>
      <p class="meta"><span id="heroMeta">&nbsp;</span><button id="heroFresh" hidden>처음부터</button></p>
      <div class="cta">
        <button class="pill primary" id="goAuto"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4v16l13-8z"/></svg>읽어 줘요</button>
        <button class="pill" id="goTogether"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 6.200C10 4.700 7.300 4 3 4v15c4.300 0 7 .7 9 2.200 2-1.500 4.700-2.200 9-2.200V4c-4.300 0-7 .7-9 2.200zm-1 12.300c-1.700-.8-3.800-1.300-6-1.400V6.100c2.500.1 4.500.7 6 1.800z"/></svg><span id="goTogetherLabel">함께 읽어요</span></button>
      </div>
    </div>
  </section>
  <section class="shelf">
    <div class="shelf-head">
      <h3>이야기 고르기</h3>
      <button class="pill" id="random"></button>
    </div>
    <div class="row" id="tiles"></div>
  </section>
</div>
<script src="engine/settings.js"></script>
<script src="engine/lightbox.js"></script>
<script src="engine/story.js"></script>
<script src="home.js"></script>
</body>
</html>
